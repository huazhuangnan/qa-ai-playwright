name: Python QA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run all operating systems and browsers
        type: boolean
        default: false
      run_api:
        description: Run real API and integration tests
        type: boolean
        default: false
      qa_env:
        description: QA environment profile
        type: string
        default: stg

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && !inputs.full_suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QA_ENV: dev
      UI_BASE_URL: ${{ vars.QA_UI_BASE_URL || vars.QA_BASE_URL }}
      API_BASE_URL: ${{ vars.QA_API_BASE_URL || vars.QA_BASE_URL }}
      QA_AUTH_ROLES: ${{ vars.QA_AUTH_ROLES }}
      QA_AUTH_ROLE: ${{ vars.QA_AUTH_ROLE }}
      QA_AUTH_LOGIN_PATH: ${{ vars.QA_AUTH_LOGIN_PATH }}
      QA_AUTH_USERNAME_SELECTOR: ${{ vars.QA_AUTH_USERNAME_SELECTOR }}
      QA_AUTH_PASSWORD_SELECTOR: ${{ vars.QA_AUTH_PASSWORD_SELECTOR }}
      QA_AUTH_SUBMIT_SELECTOR: ${{ vars.QA_AUTH_SUBMIT_SELECTOR }}
      QA_AUTH_SUCCESS_SELECTOR: ${{ vars.QA_AUTH_SUCCESS_SELECTOR }}
      QA_AUTH_SUCCESS_URL: ${{ vars.QA_AUTH_SUCCESS_URL }}
      QA_AUTH_INDEXED_DB: ${{ vars.QA_AUTH_INDEXED_DB }}
      QA_AUTH_ADMIN_USERNAME: ${{ secrets.QA_AUTH_ADMIN_USERNAME }}
      QA_AUTH_ADMIN_PASSWORD: ${{ secrets.QA_AUTH_ADMIN_PASSWORD }}
      QA_AUTH_USER_USERNAME: ${{ secrets.QA_AUTH_USER_USERNAME }}
      QA_AUTH_USER_PASSWORD: ${{ secrets.QA_AUTH_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python scripts/check_lock.py
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m playwright install --with-deps chromium
      - name: Generate auth states
        if: ${{ vars.QA_AUTH_ROLES != '' }}
        run: python scripts/auth_state.py
      - run: >-
          python -m pytest tests/unit tests/functional tests/e2e
          --browser chromium --tracing retain-on-failure
          --screenshot only-on-failure
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-quick
          path: |
            reports/
            test-results/
          retention-days: 7

  full:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.full_suite
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
        browser: [chromium, firefox, webkit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QA_ENV: dev
      UI_BASE_URL: ${{ vars.QA_UI_BASE_URL || vars.QA_BASE_URL }}
      API_BASE_URL: ${{ vars.QA_API_BASE_URL || vars.QA_BASE_URL }}
      QA_AUTH_ROLES: ${{ vars.QA_AUTH_ROLES }}
      QA_AUTH_ROLE: ${{ vars.QA_AUTH_ROLE }}
      QA_AUTH_LOGIN_PATH: ${{ vars.QA_AUTH_LOGIN_PATH }}
      QA_AUTH_USERNAME_SELECTOR: ${{ vars.QA_AUTH_USERNAME_SELECTOR }}
      QA_AUTH_PASSWORD_SELECTOR: ${{ vars.QA_AUTH_PASSWORD_SELECTOR }}
      QA_AUTH_SUBMIT_SELECTOR: ${{ vars.QA_AUTH_SUBMIT_SELECTOR }}
      QA_AUTH_SUCCESS_SELECTOR: ${{ vars.QA_AUTH_SUCCESS_SELECTOR }}
      QA_AUTH_SUCCESS_URL: ${{ vars.QA_AUTH_SUCCESS_URL }}
      QA_AUTH_INDEXED_DB: ${{ vars.QA_AUTH_INDEXED_DB }}
      QA_AUTH_ADMIN_USERNAME: ${{ secrets.QA_AUTH_ADMIN_USERNAME }}
      QA_AUTH_ADMIN_PASSWORD: ${{ secrets.QA_AUTH_ADMIN_PASSWORD }}
      QA_AUTH_USER_USERNAME: ${{ secrets.QA_AUTH_USER_USERNAME }}
      QA_AUTH_USER_PASSWORD: ${{ secrets.QA_AUTH_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python scripts/check_lock.py
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m playwright install ${{ matrix.browser }}
      - if: runner.os == 'Linux'
        run: python -m playwright install-deps ${{ matrix.browser }}
      - name: Generate auth states
        if: ${{ vars.QA_AUTH_ROLES != '' }}
        run: python scripts/auth_state.py
      - run: >-
          python -m pytest tests/functional tests/e2e
          --browser ${{ matrix.browser }} --tracing retain-on-failure
          --screenshot only-on-failure
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 7

  api:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.qa_env }}
    env:
      QA_ENV: ${{ inputs.qa_env }}
      API_BASE_URL: ${{ vars.QA_API_BASE_URL || secrets.QA_API_BASE_URL || vars.QA_BASE_URL || secrets.QA_BASE_URL }}
      QA_API_TOKEN: ${{ secrets.QA_API_TOKEN }}
      REQUIRE_API_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Require API configuration
        shell: bash
        run: |
          if [[ -z "$API_BASE_URL" ]]; then
            echo "QA_API_BASE_URL or QA_BASE_URL is required for API tests" >&2
            exit 1
          fi
      - run: python scripts/check_lock.py
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m pytest tests/api -m api
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-api-${{ inputs.qa_env }}
          path: reports/
          retention-days: 7
