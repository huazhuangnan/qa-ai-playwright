name: Clean up managed registrations
description: Remove owned MCP registrations while preserving environment data.
runs:
  using: composite
  steps:
    - name: Cleanup (PowerShell 7)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & .\packages\qa-cli\bin\qa.cmd env uninstall
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Cleanup (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        bash packages/qa-cli/bin/qa.sh env uninstall
