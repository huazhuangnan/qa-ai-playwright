name: CI
on:
  push:
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - '**/CHANGELOG.md'
      - '.agents/**'
      - '.github/**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - '**/CHANGELOG.md'
      - '.agents/**'
      - '.github/**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global-install:
    name: Global install and uninstall / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check Unix installation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          failed_home="$RUNNER_TEMP/qa failed install home with spaces"
          failing_bin="$RUNNER_TEMP/qa failing bin"
          mkdir -p "$failed_home" "$failing_bin"
          printf '#!/bin/sh\nexit 1\n' > "$failing_bin/cp"
          chmod +x "$failing_bin/cp"
          if HOME="$failed_home" PATH="$failing_bin:$PATH" bash packages/qa-cli/bin/install.sh; then
            echo 'Expected initial installation failure' >&2
            exit 1
          fi
          test ! -e "$failed_home/.local/share/qa-ai-playwright"
          test ! -e "$failed_home/.local/bin/qa"
          export HOME="$RUNNER_TEMP/qa home with spaces"
          export QA_ROOT="$RUNNER_TEMP/qa isolated environment"
          export CODEX_HOME="$RUNNER_TEMP/qa isolated codex"
          mkdir -p "$HOME"
          printf 'export QA_USER_SETTING=1' > "$HOME/.bashrc"
          bash packages/qa-cli/bin/install.sh
          (cd "$RUNNER_TEMP" && HOME="$HOME" bash -lc 'test "$(command -v qa)" = "$HOME/.local/bin/qa" && qa --help | grep -F "qa project init" >/dev/null')
          if command -v zsh >/dev/null 2>&1; then
            (cd "$RUNNER_TEMP" && HOME="$HOME" zsh -lc 'test "$(command -v qa)" = "$HOME/.local/bin/qa" && qa --help | grep -F "qa project init" >/dev/null')
          fi
          grep -Fx 'export QA_USER_SETTING=1' "$HOME/.bashrc"
          grep -Fx 'export PATH="$HOME/.local/bin:$PATH" # QA-AI-PLAYWRIGHT' "$HOME/.bashrc"
          printf '#!/bin/sh\nexit 1\n' > "$failing_bin/mv"
          chmod +x "$failing_bin/mv"
          if PATH="$failing_bin:$PATH" bash packages/qa-cli/bin/install.sh; then echo 'Expected upgrade failure' >&2; exit 1; fi
          test -f "$HOME/.local/share/qa-ai-playwright/packages/qa-cli/bin/qa.sh"
          for stage in "$HOME/.local/share/qa-ai-playwright"/.upgrade.*; do
            if [[ -d "$stage" ]]; then rm -rf "$stage"; fi
          done
          test -x "$HOME/.local/bin/qa"
          test -f "$HOME/.zprofile"
          bash packages/qa-cli/bin/install.sh
          mkdir -p "$QA_ROOT"
          printf 'qa-local-environment-v1' > "$QA_ROOT/.qa-managed"
          printf 'modified' >> "$HOME/.local/share/qa-ai-playwright/packages/qa-cli/bin/qa.sh"
          if bash packages/qa-cli/bin/install.sh; then echo 'Expected upgrade conflict' >&2; exit 1; fi
          if bash packages/qa-cli/bin/install.sh --uninstall; then echo 'Expected integrity failure' >&2; exit 1; fi
          test -x "$HOME/.local/bin/qa"
          cp packages/qa-cli/bin/qa.sh "$HOME/.local/share/qa-ai-playwright/packages/qa-cli/bin/qa.sh"
          bash packages/qa-cli/bin/install.sh --uninstall
          test ! -e "$HOME/.local/share/qa-ai-playwright"
          test ! -e "$HOME/.profile"
          test ! -e "$HOME/.bash_profile"
          test ! -e "$HOME/.bash_login"
          test ! -e "$HOME/.zprofile"
          test ! -e "$HOME/.zshrc"
          grep -Fx 'export QA_USER_SETTING=1' "$HOME/.bashrc"
          rm "$QA_ROOT/.qa-managed"
          mkdir -p "$HOME/.local/share/qa-ai-playwright/node"
          printf 'preserve node' > "$HOME/.local/share/qa-ai-playwright/node/.qa-test"
          bash packages/qa-cli/bin/install.sh
          test -f "$HOME/.local/share/qa-ai-playwright/node/.qa-test"
          bash packages/qa-cli/bin/install.sh --uninstall
          test -f "$HOME/.local/share/qa-ai-playwright/node/.qa-test"
          bash packages/qa-cli/bin/install.sh
          test -f "$HOME/.local/share/qa-ai-playwright/node/.qa-test"
          bash packages/qa-cli/bin/install.sh --uninstall
          bash packages/qa-cli/bin/install.sh
          printf 'modified' >> "$HOME/.local/share/qa-ai-playwright/packages/qa-cli/bin/qa.sh"
          bash packages/qa-cli/bin/install.sh --uninstall
          test ! -e "$HOME/.local/bin/qa"
          test -f "$HOME/.local/share/qa-ai-playwright/packages/qa-cli/bin/qa.sh"
          ! grep -q QA-AI-PLAYWRIGHT "$HOME/.zprofile"
      - name: Check Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'qa home with spaces'
          $env:QA_ROOT = Join-Path $env:RUNNER_TEMP 'qa isolated environment'
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'qa isolated codex'
          $originalPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $originalProcessPath = $env:Path
          try {
            $invalidLocalAppData = Join-Path $env:RUNNER_TEMP 'qa invalid local app data'
            Set-Content -LiteralPath $invalidLocalAppData -Value 'not a directory'
            $env:LOCALAPPDATA = $invalidLocalAppData
            $failureMessage = $null
            try { ./packages/qa-cli/bin/install.ps1 } catch { $failureMessage = $_.Exception.Message }
            if (!$failureMessage -or $failureMessage -notmatch 'qa-ai-playwright|qa invalid local app data') { throw "Expected initial installation failure, got: $failureMessage" }
            if ([Environment]::GetEnvironmentVariable('Path', 'User') -ne $originalPath) { throw 'Failed installation changed PATH' }
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'qa home with spaces'
            $expectedBin = Join-Path (Join-Path $env:LOCALAPPDATA 'qa-ai-playwright') 'bin'
            $trailingBin = $expectedBin + '\'
            [Environment]::SetEnvironmentVariable('Path', (($entries + $trailingBin) -join ';'), 'User')
            ./packages/qa-cli/bin/install.ps1
            if (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'qa-ai-playwright/.path-added')) { throw 'Equivalent PATH entry was not reused' }
            ./packages/qa-cli/bin/install.ps1 -Uninstall
            if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $trailingBin) { throw 'Preexisting PATH entry was removed' }
            [Environment]::SetEnvironmentVariable('Path', $originalPath, 'User')
            ./packages/qa-cli/bin/install.ps1
            $root = Join-Path $env:LOCALAPPDATA 'qa-ai-playwright'
            if (!(Test-Path (Join-Path $root 'bin/qa.cmd'))) { throw 'Missing command' }
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
            $globalCommand = Get-Command qa -CommandType Application -ErrorAction Stop | Select-Object -First 1
            if ($globalCommand.Source -ine (Join-Path $root 'bin/qa.cmd')) { throw 'PATH resolved to an unexpected qa command' }
            Push-Location $env:RUNNER_TEMP
            try {
                & $globalCommand.Source --help
                if ($LASTEXITCODE -ne 0) { throw 'Installed command failed' }
            } finally {
                Pop-Location
            }
            $installedCommand = Join-Path $root 'bin/qa.cmd'
            $lfCommand = [IO.File]::ReadAllText($installedCommand).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($installedCommand, $lfCommand, [Text.UTF8Encoding]::new($false))
            & $globalCommand.Source --help
            if ($LASTEXITCODE -ne 0) { throw 'LF command wrapper failed' }
            ./packages/qa-cli/bin/install.ps1
            New-Item -ItemType Directory -Force -Path $env:QA_ROOT | Out-Null
            Set-Content -LiteralPath (Join-Path $env:QA_ROOT '.qa-managed') -Value 'qa-local-environment-v1'
            Add-Content -LiteralPath (Join-Path $root 'packages/qa-cli/bin/qa.cmd') -Value 'modified'
            $conflictMessage = $null
            try { ./packages/qa-cli/bin/install.ps1 } catch { $conflictMessage = $_.Exception.Message }
            if ($conflictMessage -notmatch '^Modified installed file: packages\\qa-cli\\bin\\qa\.cmd$') { throw "Expected upgrade conflict, got: $conflictMessage" }
            $integrityMessage = $null
            try { ./packages/qa-cli/bin/install.ps1 -Uninstall } catch { $integrityMessage = $_.Exception.Message }
            if ($integrityMessage -notmatch '^Installed files changed; environment cleanup cancelled$') { throw "Expected integrity failure, got: $integrityMessage" }
            if (!(Test-Path (Join-Path $root 'bin/qa.cmd'))) { throw 'Installation was removed after failure' }
            Copy-Item -LiteralPath 'packages/qa-cli/bin/qa.cmd' -Destination (Join-Path $root 'packages/qa-cli/bin/qa.cmd') -Force
            ./packages/qa-cli/bin/install.ps1 -Uninstall
            if (Test-Path $root) { throw 'Installation remains' }
            Remove-Item -LiteralPath (Join-Path $env:QA_ROOT '.qa-managed')
            New-Item -ItemType Directory -Force -Path (Join-Path $root 'node') | Out-Null
            Set-Content -LiteralPath (Join-Path $root 'node/.qa-test') -Value 'preserve node'
            ./packages/qa-cli/bin/install.ps1
            if (!(Test-Path (Join-Path $root 'node/.qa-test'))) { throw 'Node data was not preserved' }
            ./packages/qa-cli/bin/install.ps1 -Uninstall
            if (!(Test-Path (Join-Path $root 'node/.qa-test'))) { throw 'Node data was removed' }
            ./packages/qa-cli/bin/install.ps1
            if (!(Test-Path (Join-Path $root 'node/.qa-test'))) { throw 'Node data was not reused' }
            Remove-Item -LiteralPath (Join-Path $root 'bin/qa.cmd')
            ./packages/qa-cli/bin/install.ps1 -Uninstall
            if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains (Join-Path $root 'bin')) { throw 'Managed PATH entry remains' }
            ./packages/qa-cli/bin/install.ps1
            Add-Content -LiteralPath (Join-Path $root 'packages/qa-cli/bin/qa.cmd') -Value 'modified'
            ./packages/qa-cli/bin/install.ps1 -Uninstall
            if (Test-Path (Join-Path $root 'bin/qa.cmd')) { throw 'Command remains' }
            if (!(Test-Path (Join-Path $root 'packages/qa-cli/bin/qa.cmd'))) { throw 'Modified file removed' }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $originalPath, 'User')
            $env:Path = $originalProcessPath
          }

  session-shortcut:
    name: Session shortcut / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check PowerShell shortcut
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'qa package with spaces'
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Copy-Item -Recurse packages $packageRoot
          Set-Alias qa (Join-Path $packageRoot 'packages/qa-cli/bin/qa.cmd')
          Set-Location $env:RUNNER_TEMP
          qa --help
          if ($LASTEXITCODE -ne 0) { throw 'Shortcut failed' }
      - name: Check Bash shortcut
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_root="$RUNNER_TEMP/qa package with spaces"
          mkdir -p "$package_root"
          cp -R packages "$package_root/"
          source "$package_root/packages/qa-cli/bin/session.sh"
          cd "$RUNNER_TEMP"
          qa --help
          if qa --root '' --help; then
            echo 'Expected invalid root to fail' >&2
            exit 1
          fi
      - name: Check zsh shortcut
        if: runner.os == 'macOS'
        shell: bash
        run: |
          zsh -c 'source "$1/packages/qa-cli/bin/session.sh"; cd "$2"; qa --help' -- "$RUNNER_TEMP/qa package with spaces" "$RUNNER_TEMP"

  quality:
    name: Type check and maintenance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QA_ROOT: ${{ github.workspace }}/workspaces/quality environment
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Isolate shared tools and Codex configuration
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP 'qa-test-home'
          $prefix = Join-Path $env:RUNNER_TEMP 'qa-global'
          $bin = if ($IsWindows) { $prefix } else { Join-Path $prefix 'bin' }
          $config = Join-Path $env:RUNNER_TEMP 'qa-npmrc'
          New-Item -ItemType Directory -Force -Path $testHome, $bin | Out-Null
          $npmPrefix = $prefix.Replace('\', '/')
          "prefix=$npmPrefix" | Out-File -FilePath $config -Encoding utf8
          "NPM_CONFIG_USERCONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CODEX_HOME=$(Join-Path $testHome 'codex')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XDG_DATA_HOME=$(Join-Path $testHome 'data')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALAPPDATA=$(Join-Path $testHome 'appdata')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify cold bootstrap prerequisites
        shell: pwsh
        run: node --experimental-strip-types tests/bootstrap-preflight.ts
      - name: Verify text line endings
        shell: bash
        run: |
          if git grep -Il $'\r' -- .; then
            echo 'CRLF found in tracked text files' >&2
            exit 1
          fi
          if git grep -Il $'\xEF\xBB\xBF' -- .; then
            echo 'UTF-8 BOM found in tracked text files' >&2
            exit 1
          fi
      - uses: ./.github/actions/bootstrap
        with:
          stack: typescript
          skills: 'false'
      - name: Install maintenance dependencies
        shell: bash
        run: bash packages/qa-cli/bin/qa.sh run pnpm install --frozen-lockfile --ignore-scripts
      - name: Run type check and maintenance tests
        shell: bash
        run: |
          bash packages/qa-cli/bin/qa.sh run bun run typecheck
          bash packages/qa-cli/bin/qa.sh run bun run test:unit
          bash packages/qa-cli/bin/qa.sh run bun test tests/cli-arguments.test.ts
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
      - name: Check CLI argument contract on Node
        run: node --experimental-strip-types --test tests/cli-arguments.test.ts
      - uses: ./.github/actions/cleanup
        if: always()

  environment-smoke:
    name: Environment smoke / ${{ matrix.os }} / latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QA_ROOT: ${{ github.workspace }}/workspaces/environment smoke with spaces
      QA_NODE_MAJOR: '26'
      QA_PYTHON_VERSION: '3.15'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Isolate shared tools and Codex configuration
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP 'qa-test-home'
          $prefix = Join-Path $env:RUNNER_TEMP 'qa-global'
          $bin = if ($IsWindows) { $prefix } else { Join-Path $prefix 'bin' }
          $config = Join-Path $env:RUNNER_TEMP 'qa-npmrc'
          New-Item -ItemType Directory -Force -Path $testHome, $bin | Out-Null
          $npmPrefix = $prefix.Replace('\', '/')
          "prefix=$npmPrefix" | Out-File -FilePath $config -Encoding utf8
          "NPM_CONFIG_USERCONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CODEX_HOME=$(Join-Path $testHome 'codex')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XDG_DATA_HOME=$(Join-Path $testHome 'data')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALAPPDATA=$(Join-Path $testHome 'appdata')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify cold bootstrap prerequisites
        shell: pwsh
        run: node --experimental-strip-types tests/bootstrap-preflight.ts
      - uses: ./.github/actions/bootstrap
        with:
          stack: both
          codex: 'true'
          full: 'true'
          cc-switch: 'true'
      - name: Install maintenance dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\packages\qa-cli\bin\qa.cmd run pnpm install --frozen-lockfile --ignore-scripts
          exit $LASTEXITCODE
      - name: Install dependencies and run maintenance tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash packages/qa-cli/bin/qa.sh run pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & .\packages\qa-cli\bin\qa.cmd --help 2>&1 | Out-String
          if ($output -notmatch 'PowerShell: 7\.') { throw 'qa.cmd did not prefer PowerShell 7' }
          & .\packages\qa-cli\bin\qa.cmd run bun tests/ci-cases.ts env
          exit $LASTEXITCODE
      - name: Verify environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash packages/qa-cli/bin/qa.sh run bun tests/ci-cases.ts env
      - name: Verify full browser setup without Codex
        shell: pwsh
        run: |
          $env:QA_ROOT = Join-Path $env:RUNNER_TEMP 'qa-full-without-codex'
          if ($IsWindows) {
            & .\packages\qa-cli\bin\qa.cmd env init typescript --full --skip-codex
          } else {
            & bash packages/qa-cli/bin/qa.sh env init typescript --full --skip-codex
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $state = Get-Content -Raw -LiteralPath (Join-Path $env:QA_ROOT 'state.json') | ConvertFrom-Json
          $browser = @($state.installations.chrome, $state.installations.msedge, $state.installations.chromium) | Where-Object { $_.status -eq 'ready' } | Select-Object -First 1
          if (-not $browser.path -or -not (Test-Path -LiteralPath $browser.path)) { throw 'Selected browser executable was not recorded' }
          if ($IsWindows) {
            & .\packages\qa-cli\bin\qa.cmd run agent-browser open about:blank
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\packages\qa-cli\bin\qa.cmd run agent-browser close
          } else {
            & bash packages/qa-cli/bin/qa.sh run agent-browser open about:blank
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & bash packages/qa-cli/bin/qa.sh run agent-browser close
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload environment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: environment-smoke-${{ matrix.os }}
          path: workspaces/environment smoke with spaces/state.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify shared uninstall protection (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\packages\qa-cli\bin\qa.cmd run bun tests/ci-cases.ts shared-uninstall
          exit $LASTEXITCODE
      - name: Verify shared uninstall protection (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash packages/qa-cli/bin/qa.sh run bun tests/ci-cases.ts shared-uninstall
      - uses: ./.github/actions/cleanup
        if: always()

  project-smoke:
    name: Project smoke / ${{ matrix.os }} / ${{ matrix.stack }} / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
        stack: [typescript, python]
        browser: [chromium]
        include:
          - os: windows-2025
            stack: typescript
            browser: chrome
          - os: windows-2025
            stack: python
            browser: chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QA_ROOT: ${{ github.workspace }}/workspaces/project smoke with spaces
      QA_TEST_STACK: ${{ matrix.stack }}
      QA_TEST_BROWSERS: ${{ matrix.browser }}
      QA_NODE_MAJOR: '26'
      QA_PYTHON_VERSION: '3.15'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Isolate shared tools and Codex configuration
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP 'qa-test-home'
          $prefix = Join-Path $env:RUNNER_TEMP 'qa-global'
          $bin = if ($IsWindows) { $prefix } else { Join-Path $prefix 'bin' }
          $config = Join-Path $env:RUNNER_TEMP 'qa-npmrc'
          New-Item -ItemType Directory -Force -Path $testHome, $bin | Out-Null
          $npmPrefix = $prefix.Replace('\', '/')
          "prefix=$npmPrefix" | Out-File -FilePath $config -Encoding utf8
          "NPM_CONFIG_USERCONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CODEX_HOME=$(Join-Path $testHome 'codex')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "XDG_DATA_HOME=$(Join-Path $testHome 'data')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOCALAPPDATA=$(Join-Path $testHome 'appdata')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify cold bootstrap prerequisites
        shell: pwsh
        run: node --experimental-strip-types tests/bootstrap-preflight.ts
      - uses: ./.github/actions/bootstrap
        with:
          stack: both
          skills: 'false'
      - name: Install dependencies and run project smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\packages\qa-cli\bin\qa.cmd run pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .\packages\qa-cli\bin\qa.cmd run bun tests/ci-cases.ts project
          exit $LASTEXITCODE
      - name: Install dependencies and run project smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash packages/qa-cli/bin/qa.sh run pnpm install --frozen-lockfile --ignore-scripts
          bash packages/qa-cli/bin/qa.sh run bun tests/ci-cases.ts project
      - name: Upload project evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: project-smoke-${{ matrix.os }}-${{ matrix.stack }}-${{ matrix.browser }}
          path: |
            workspaces/test project ${{ matrix.stack }}/.qa-project.json
            workspaces/test project ${{ matrix.stack }}/reports/
            workspaces/test project ${{ matrix.stack }}/playwright-report/
            workspaces/test project ${{ matrix.stack }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/cleanup
        if: always()

  release-check:
    name: Check existing GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [global-install, session-shortcut, quality, environment-smoke, project-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.release-check.outputs.exists }}
    steps:
      - name: Check existing release
        id: release-check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; publish job will be skipped"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-check.outputs.exists != 'true'
    needs: [global-install, session-shortcut, quality, environment-smoke, project-smoke, release-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      QA_ROOT: ${{ github.workspace }}/workspaces/qa-release-environment
      QA_NODE_MAJOR: '26'
      QA_PYTHON_VERSION: '3.15'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Create release archive
        shell: bash
        run: bun run package:release -- --output "$RUNNER_TEMP/release"
      - name: Verify release archive
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/unpacked-release"
          unzip -q "$RUNNER_TEMP/release/qa-ai-playwright-${GITHUB_REF_NAME}.zip" -d "$RUNNER_TEMP/unpacked-release"
          root="$RUNNER_TEMP/unpacked-release/qa-ai-playwright-${GITHUB_REF_NAME}"
          test -f "$root/packages/qa-cli/bin/install.sh"
          test -f "$root/packages/qa-cli/bin/install.ps1"
          test -f "$root/packages/templates/typescript/AGENTS.md"
          test -f "$root/packages/templates/python/AGENTS.md"
          test ! -e "$root/AGENTS.md"
          test ! -e "$root/docs/maintainers"
          bash "$root/packages/qa-cli/bin/qa.sh" --help
          QA_ROOT="$RUNNER_TEMP/release-env" bash "$root/packages/qa-cli/bin/qa.sh" env init typescript --skip-codex --skip-skills
          QA_ROOT="$RUNNER_TEMP/release-env" bash "$root/packages/qa-cli/bin/qa.sh" project init "$RUNNER_TEMP/release-project" --language typescript
          test -f "$RUNNER_TEMP/release-project/AGENTS.md"
      - name: Create checksums
        shell: bash
        working-directory: ${{ runner.temp }}/release
        run: sha256sum qa-ai-playwright-*.zip > SHA256SUMS.txt
      - name: Prepare release notes
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            cp "$notes" "$RUNNER_TEMP/release-notes.md"
          else
            : > "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          user_zip="$RUNNER_TEMP/release/qa-ai-playwright-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" \
            "$user_zip" \
            "$RUNNER_TEMP/release/SHA256SUMS.txt" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md"
