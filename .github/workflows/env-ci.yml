name: 01 - Environment installation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check tracked text line endings
        shell: bash
        run: |
          if git grep --cached -Il $'\r' -- .; then
            echo 'Tracked text files must use LF line endings.' >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi
      - name: Lint repository and template workflows
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            .github/workflows/env-ci.yml \
            .github/workflows/project-ci.yml \
            .github/workflows/uninstall-ci.yml \
            packages/qa-ai-playwright/src/templates/typescript/.github/workflows/qa.yml \
            packages/qa-ai-playwright/src/templates/python/.github/workflows/qa.yml
  environment:
    name: Environment / ${{ matrix.os }} / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
        profile: [latest, compatible]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QA_ROOT: ${{ github.workspace }}/workspaces/environment with spaces
      QA_NODE_MAJOR: ${{ matrix.profile == 'compatible' && '24' || '26' }}
      QA_PYTHON_VERSION: ${{ matrix.profile == 'compatible' && '3.14' || '3.15' }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bootstrap
        with:
          stack: both
          codex: 'true'
          full: 'true'
      - name: Type-check repository maintenance code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\packages\qa-ai-playwright\src\bin\qa.cmd run pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .\packages\qa-ai-playwright\src\bin\qa.cmd run bun run typecheck
          exit $LASTEXITCODE
      - name: Type-check repository maintenance code (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash packages/qa-ai-playwright/src/bin/qa.sh run pnpm install --frozen-lockfile --ignore-scripts
          bash packages/qa-ai-playwright/src/bin/qa.sh run bun run typecheck
      - name: Verify environment, actual versions and repeat install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & .\packages\qa-ai-playwright\src\bin\qa.cmd --help 2>&1 | Out-String
          if ($output -notmatch 'PowerShell: 7\.') { throw 'qa.cmd did not prefer PowerShell 7' }
          & .\packages\qa-ai-playwright\src\bin\qa.cmd run bun tests/ci-cases.ts env
          exit $LASTEXITCODE
      - name: Verify environment, actual versions and repeat install (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash packages/qa-ai-playwright/src/bin/qa.sh run bun tests/ci-cases.ts env
      - name: Verify on-demand external Skill commands
        if: runner.os == 'Linux' && matrix.profile == 'latest'
        shell: bash
        run: bash packages/qa-ai-playwright/src/bin/qa.sh run bun tests/external-skills-ci.ts
      - name: Record exact resolved versions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: environment-${{ matrix.os }}-${{ matrix.profile }}
          path: workspaces/environment with spaces/state.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/cleanup
        if: always()
  powershell-fallback:
    name: Windows PowerShell 5.1 fallback
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      QA_ROOT: ${{ github.workspace }}/workspaces/powershell 5 fallback
      QA_POWERSHELL: powershell.exe
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bootstrap
        with:
          stack: python
          skills: 'false'
      - name: Verify fallback
        shell: powershell
        run: |
          $output = & .\packages\qa-ai-playwright\src\bin\qa.cmd --help 2>&1 | Out-String
          if ($output -notmatch 'PowerShell: 5\.1') { throw 'qa.cmd did not fall back to Windows PowerShell 5.1' }
          & .\packages\qa-ai-playwright\src\bin\qa.cmd env check python --skip-codex --skip-skills
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: ./.github/actions/cleanup
        if: always()
  minimal-linux:
    name: Minimal Linux / no Python, Node, Homebrew, sudo
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace ubuntu:24.04 bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl tar gzip
            ! command -v python3
            ! command -v node
            ! command -v brew
            ! command -v sudo
            export QA_ROOT=/workspace/workspaces/minimal-environment
            bash packages/qa-ai-playwright/src/bin/qa.sh env init both
            bash packages/qa-ai-playwright/src/bin/qa.sh env check both
            bash packages/qa-ai-playwright/src/bin/qa.sh run bun run test:unit
            bash packages/qa-ai-playwright/src/bin/qa.sh env uninstall
            test ! -e "$QA_ROOT"
          '
